name: One bounded clocked snapshot stage
'on':
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      phase:
        type: number
        required: true
      slot:
        type: number
        required: true
      checkpoint:
        type: string
        default: ''
      skip:
        type: boolean
        default: false
    secrets:
      DOMINO_RCLONE_CONFIG_B64:
        required: true
      OPENEYE_NETWORK_RESUME_KEY_B64:
        required: true
    outputs:
      phase_complete:
        value: ${{ jobs.execute.outputs.phase_complete || jobs.noop.outputs.phase_complete }}
      checkpoint_name:
        value: ${{ jobs.execute.outputs.checkpoint_name || jobs.noop.outputs.checkpoint_name }}
permissions:
  contents: read
env:
  OPENEYE_PIN: 9a742fbd42a55ebfa8fcd39aa41dfa36a367572f
jobs:
  noop:
    if: github.repository == 'baichuu/DominoSearch-OpenEye-Runtime' && inputs.skip
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      phase_complete: ${{ steps.propagate.outputs.phase_complete }}
      checkpoint_name: ${{ steps.propagate.outputs.checkpoint_name }}
    steps:
    - name: Reuse completed stage without executing RTL
      id: propagate
      env:
        PREVIOUS_CHECKPOINT: ${{ inputs.checkpoint }}
      run: printf "phase_complete=true\ncheckpoint_name=%s\n" "$PREVIOUS_CHECKPOINT" >> "$GITHUB_OUTPUT"
  execute:
    if: github.repository == 'baichuu/DominoSearch-OpenEye-Runtime' && !inputs.skip
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      phase_complete: ${{ steps.chunk.outputs.phase_complete }}
      checkpoint_name: ${{ steps.chunk.outputs.checkpoint_name }}
    steps:
    - name: Check out exact public execution source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: Runtime
        persist-credentials: false
    - name: Check out pinned source for initial controls
      uses: actions/checkout@v4
      if: inputs.phase == 0 && inputs.slot == 0
      with:
        repository: Learning-Chips-Lab/OpenEye
        ref: ${{ env.OPENEYE_PIN }}
        path: OpenEye
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install bounded stage dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y iverilog make patch rclone

        python -m venv OpenEye/.venv

        OpenEye/.venv/bin/python -m pip install -r Runtime/clocked_runtime/fpga/openeye/requirements-clocked.txt -r Runtime/clocked_runtime/fpga/openeye/requirements-network-resume.txt

        '
    - name: Set up exact simulator for initial model build
      uses: veryl-lang/setup-verilator@b155747595eb4b817473a83045ba1da581c4084b
      if: inputs.phase == 0 && inputs.slot == 0
      with:
        version: '5.052'
    - name: Initial rejection controls and pinned PE
      if: inputs.phase == 0 && inputs.slot == 0
      working-directory: Runtime/clocked_runtime
      env:
        OPENEYE_NEW_PIN_ROOT: ${{ github.workspace }}/OpenEye
      run: 'test "$(git -C ../../OpenEye rev-parse HEAD)" = "$OPENEYE_PIN"

        test -z "$(git -C ../../OpenEye status --short)"

        ../../OpenEye/.venv/bin/python -m pytest -q tests/test_clocked_graph_validation.py tests/test_clocked_release_ingress.py
        tests/test_clocked_snapshot.py tests/test_clocked_resume_control.py tests/test_clocked_resume_workflow.py tests/test_clocked_workflow.py
        tests/test_clocked_audit_failure.py tests/test_clocked_convolution_zero_policy.py tests/test_retain_zero_sparse_format_rtl.py
        tests/test_clocked_pooling_ring.py

        fpga/openeye/run_pe_smoke.sh ../../OpenEye "$RUNNER_TEMP/pinned-pe-smoke.log"

        '
    - name: Verify original immutable inputs and owner-only access
      working-directory: Runtime/clocked_runtime
      env:
        DOMINO_RCLONE_CONFIG_B64: ${{ secrets.DOMINO_RCLONE_CONFIG_B64 }}
        CLOCKED_PROFILE: ${{ inputs.profile }}
      run: 'python fpga/openeye/prepare_ci_rclone_config.py --output "$RUNNER_TEMP/clocked-rclone.conf"

        ../../OpenEye/.venv/bin/python fpga/openeye/clocked_release_ingress.py --release fpga/openeye/clocked-release.json
        --profile "$CLOCKED_PROFILE" --config "$RUNNER_TEMP/clocked-rclone.conf" --output "$RUNNER_TEMP/clocked-inputs" >
        "$RUNNER_TEMP/private-ingress.log" 2>&1

        '
    - name: Execute or restore exact machine state
      id: chunk
      working-directory: Runtime/clocked_runtime
      env:
        OPENEYE_NETWORK_RESUME_KEY_B64: ${{ secrets.OPENEYE_NETWORK_RESUME_KEY_B64 }}
        CLOCKED_PROFILE: ${{ inputs.profile }}
        CLOCKED_CHECKPOINT: ${{ inputs.checkpoint }}
        CLOCKED_PHASE: ${{ inputs.phase }}
        CLOCKED_SLOT: ${{ inputs.slot }}
      run: 'set +e

        ../../OpenEye/.venv/bin/python fpga/openeye/clocked_stage_job.py stage --release fpga/openeye/clocked-release.json
        --workspace "$RUNNER_TEMP/clocked-inputs" --config "$RUNNER_TEMP/clocked-rclone.conf" --public "$RUNNER_TEMP/public-progress"
        --profile "$CLOCKED_PROFILE" --phase "$CLOCKED_PHASE" --slot "$CLOCKED_SLOT" --checkpoint "$CLOCKED_CHECKPOINT" --wall-seconds
        10800 > "$RUNNER_TEMP/private-snapshot-stage.log" 2>&1

        status=$?

        set -e

        printf "Snapshot stage exit status: %s\n" "$status"

        exit "$status"

        '
    - name: Publish allowlisted progress only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clocked-progress-${{ inputs.profile }}-${{ inputs.phase }}-${{ inputs.slot }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-progress/progress.json
        if-no-files-found: ignore
        retention-days: 30
