      env:
        DOMINO_RCLONE_CONFIG_B64: ${{ secrets.DOMINO_RCLONE_CONFIG_B64 }}
        CLOCKED_PROFILE: ${{ inputs.profile }}
      run: 'python fpga/openeye/prepare_ci_rclone_config.py --output "$RUNNER_TEMP/clocked-rclone.conf"

        ../../OpenEye/.venv/bin/python fpga/openeye/clocked_release_ingress.py --release fpga/openeye/clocked-release.json
        --profile "$CLOCKED_PROFILE" --config "$RUNNER_TEMP/clocked-rclone.conf" --output "$RUNNER_TEMP/clocked-inputs" >
        "$RUNNER_TEMP/private-ingress.log" 2>&1

        '
    - name: Independently audit complete resumed RTL graph
      working-directory: Runtime/clocked_runtime
      env:
        OPENEYE_NETWORK_RESUME_KEY_B64: ${{ secrets.OPENEYE_NETWORK_RESUME_KEY_B64 }}
        CLOCKED_PROFILE: ${{ inputs.profile }}
        CLOCKED_CHECKPOINT: ${{ needs.phase_20_2.outputs.checkpoint_name }}
      run: 'set +e

        ../../OpenEye/.venv/bin/python fpga/openeye/clocked_stage_job.py final --release fpga/openeye/clocked-release.json
        --workspace "$RUNNER_TEMP/clocked-inputs" --config "$RUNNER_TEMP/clocked-rclone.conf" --public "$RUNNER_TEMP/public-evidence"
        --profile "$CLOCKED_PROFILE" --checkpoint "$CLOCKED_CHECKPOINT" > "$RUNNER_TEMP/private-final-audit.log" 2>&1

        status=$?

        set -e

        printf "Independent resumed full-network audit exit status: %s\n" "$status"

        exit "$status"

        '
    - name: Seal allowlisted public aggregate evidence
      if: always()
      working-directory: Runtime/clocked_runtime
      env:
        CLOCKED_PROFILE: ${{ inputs.profile }}
      run: python fpga/openeye/seal_clocked_public_evidence.py --root "$RUNNER_TEMP/public-evidence" --output "$RUNNER_TEMP/public-artifact"
        --profile "$CLOCKED_PROFILE" --execution-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
    - name: Publish audited counters and real JUnit only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clocked-resumed-final-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/public-artifact
        if-no-files-found: error
        retention-days: 30
