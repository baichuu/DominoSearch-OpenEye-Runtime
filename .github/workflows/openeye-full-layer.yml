name: OpenEye public hybrid network
'on':
  workflow_dispatch:
    inputs:
      scope:
        description: RTL scope to run
        required: true
        default: hybrid-network-resumable
        type: choice
        options:
        - hybrid-network-resumable
      resume_run_id:
        description: Original resumable run ID (blank starts a new chain; requires same execution commit)
        required: false
        default: ''
        type: string
      spatial_size:
        description: Residual pilot isolated crop size; ignored by other scopes
        required: true
        default: '56'
        type: choice
        options:
        - '8'
        - '16'
        - '56'
      scheme:
        description: Milestone candidate scheme (ignored by MAC20 sweep)
        required: true
        default: all
        type: choice
        options:
        - all
        - 4x4
        - 3x4
        - 2x4
      layer:
        description: MAC20 layer names, comma-separated (all requests every layer; geometry preflight enforced)
        required: true
        default: all
        type: string
      architecture:
        description: MAC20 hardware configuration (milestone always keeps v6)
        required: true
        default: full-layer-r3
        type: choice
        options:
        - v6
        - full-layer-r3
permissions:
  contents: read
concurrency:
  group: openeye-full-layer-${{ github.ref }}-${{ inputs.scope == 'hybrid-network-resumable' && 'network-fc-smoke' || inputs.scope }}
  cancel-in-progress: false
env:
  OPENEYE_PIN: 36395ddc530e106f06c50025a4069dd097688d8d
  CYCLE_WIDTH: "32"
  LIMIT_SIZE_IACT: "18"
  LIMIT_SIZE_WGHT: "12"
  LIMIT_SIZE_PSUM: "12"
  PYTHON_VERSION: '3.11'
  VERILATOR_VERSION: '5.052'
  BUNDLE_REMOTE: domino-drive:DominoSearch-artifacts/deployment/packed-v1-3060cf7-20260824
  OPENEYE_NETWORK_PRIVATE_REMOTE: ${{ vars.OPENEYE_NETWORK_PRIVATE_REMOTE || 'domino-drive:DominoSearch-runtime-private' }}
  OPENEYE_NETWORK_PRIVATE_POLICY: ${{ vars.OPENEYE_NETWORK_PRIVATE_POLICY || 'owner-only' }}
jobs:
  runtime_preflight:
    name: Validate runtime dispatch before simulation
    if: ${{ github.repository == 'baichuu/DominoSearch-OpenEye-Runtime' && (inputs.scope == 'residual-block-pilot' || inputs.scope == 'downsample-block-pilot' ||
      inputs.scope == 'network-fc-smoke' || inputs.scope == 'hybrid-network' || inputs.scope == 'hybrid-network-resumable') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Check out exact public runtime execution commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Validate full-network geometry and same-commit resume identity
      env:
        GH_TOKEN: ${{ github.token }}
        RUNTIME_SCOPE: ${{ inputs.scope }}
        RUNTIME_ARCHITECTURE: ${{ inputs.architecture }}
        RUNTIME_SPATIAL_SIZE: ${{ inputs.spatial_size }}
        RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      run: |
        resume_args=()
        if [[ -n "$RESUME_RUN_ID" ]]; then
          [[ "$RUNTIME_SCOPE" == hybrid-network-resumable && "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" > "$RUNNER_TEMP/resume-run.json"
          resume_args=(--resume-metadata "$RUNNER_TEMP/resume-run.json")
        fi
        python3 fpga/openeye/network_actions_preflight.py \
          --scope "$RUNTIME_SCOPE" --architecture "$RUNTIME_ARCHITECTURE" \
          --spatial-size "$RUNTIME_SPATIAL_SIZE" --commit "$GITHUB_SHA" --pin "$OPENEYE_PIN" \
          --resume-run-id "$RESUME_RUN_ID" "${resume_args[@]}" \
          --private-remote "$OPENEYE_NETWORK_PRIVATE_REMOTE" --private-policy "$OPENEYE_NETWORK_PRIVATE_POLICY" \
          --output "$RUNNER_TEMP/network-preflight.json"
    - name: Install private-storage preflight tool
      if: ${{ inputs.scope == 'hybrid-network-resumable' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y rclone
    - name: Validate dedicated key and owner-only storage before starting gates
      if: ${{ inputs.scope == 'hybrid-network-resumable' }}
      env:
        DOMINO_RCLONE_CONFIG_B64: ${{ secrets.DOMINO_RCLONE_CONFIG_B64 }}
        OPENEYE_NETWORK_RESUME_KEY_B64: ${{ secrets.OPENEYE_NETWORK_RESUME_KEY_B64 }}
      run: |
        python3 fpga/openeye/prepare_ci_rclone_config.py --output "$RUNNER_TEMP/preflight-rclone.conf"
        python3 fpga/openeye/network_checkpoint.py preflight \
          --config "$RUNNER_TEMP/preflight-rclone.conf" --verify-drive \
          --remote "$OPENEYE_NETWORK_PRIVATE_REMOTE" --sharing-policy "$OPENEYE_NETWORK_PRIVATE_POLICY"
    - name: Upload execution plan only (no private config or checkpoint)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: openeye-runtime-preflight-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/network-preflight.json
        retention-days: 30
  residual:
    name: MAC20 runtime gate ${{ matrix.gate }}
    needs: runtime_preflight
    if: ${{ github.repository == 'baichuu/DominoSearch-OpenEye-Runtime' && (inputs.scope == 'residual-block-pilot' || inputs.scope == 'downsample-block-pilot' ||
      inputs.scope == 'network-fc-smoke' || inputs.scope == 'hybrid-network' || inputs.scope == 'hybrid-network-resumable') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scope == 'downsample-block-pilot' && inputs.spatial_size == '56' && 360 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ (inputs.scope == 'hybrid-network' || inputs.scope == 'hybrid-network-resumable') && fromJSON('["downsample-block-pilot","network-fc-smoke"]') ||
          fromJSON(format('["{0}"]', inputs.scope)) }}
    steps:
    - name: Check out exact public runtime commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: DominoSearch
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Check out pinned OpenEye
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Learning-Chips-Lab/OpenEye
        ref: ${{ env.OPENEYE_PIN }}
        path: OpenEye
        persist-credentials: false
    - name: Preflight dedicated resume key and existing Drive write grant
      if: ${{ inputs.scope == 'hybrid-network-resumable' }}
      env:
        OPENEYE_NETWORK_RESUME_KEY_B64: ${{ secrets.OPENEYE_NETWORK_RESUME_KEY_B64 }}
        DOMINO_RCLONE_CONFIG_B64: ${{ secrets.DOMINO_RCLONE_CONFIG_B64 }}
      run: |
        python3 DominoSearch/fpga/openeye/prepare_ci_rclone_config.py --output "$RUNNER_TEMP/resume-preflight-rclone.conf"
        python3 DominoSearch/fpga/openeye/network_checkpoint.py preflight --config "$RUNNER_TEMP/resume-preflight-rclone.conf"
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: DominoSearch/fpga/openeye/requirements-ci.txt
    - name: Install simulation and artifact tools
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog make patch rclone
    - name: Set up pinned Verilator
      uses: veryl-lang/setup-verilator@b155747595eb4b817473a83045ba1da581c4084b
      with:
        version: ${{ env.VERILATOR_VERSION }}
    - name: Create pinned OpenEye environment
      run: |
        python -m venv OpenEye/.venv
        OpenEye/.venv/bin/python -m pip install --upgrade pip
        OpenEye/.venv/bin/python -m pip install -r DominoSearch/fpga/openeye/requirements-ci.txt
        OpenEye/.venv/bin/python -m pip install -e OpenEye
    - name: Verify pin and focused runtime tests
      working-directory: DominoSearch
      run: |
        test "$(git -C ../OpenEye rev-parse HEAD)" = "$OPENEYE_PIN"
        test -z "$(git -C ../OpenEye status --short)"
        verilator --version | grep -F "Verilator $VERILATOR_VERSION"
        ../OpenEye/.venv/bin/python -m pytest -q tests/test_runtime_activations.py tests/test_spatial_layer_tiles.py tests/test_network_runtime.py tests/test_network_evidence.py tests/test_network_drive_access.py tests/test_network_actions_preflight.py tests/test_openeye_wrapper_metrics.py tests/test_public_runtime_export.py tests/test_public_evidence.py tests/test_ci_rclone_config.py tests/test_runtime_projection_count_lifetime.py
        bash -n fpga/openeye/run_wrapper_conv_regression.sh
    - name: Configure read-only artifact access
      env:
        DOMINO_RCLONE_CONFIG_B64: ${{ secrets.DOMINO_RCLONE_CONFIG_B64 }}
      run: |
        python DominoSearch/fpga/openeye/prepare_ci_rclone_config.py --output "$RUNNER_TEMP/rclone.conf"
        rclone lsf --config "$RUNNER_TEMP/rclone.conf" "$BUNDLE_REMOTE/bundle-manifest.json" >/dev/null
    - name: Verify owner-only resume storage before costly runtime gates
      if: ${{ inputs.scope == 'hybrid-network-resumable' }}
      env:
        OPENEYE_NETWORK_RESUME_KEY_B64: ${{ secrets.OPENEYE_NETWORK_RESUME_KEY_B64 }}
      run: |
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/network_checkpoint.py preflight --config "$RUNNER_TEMP/rclone.conf" --verify-drive --remote "$OPENEYE_NETWORK_PRIVATE_REMOTE" --sharing-policy "$OPENEYE_NETWORK_PRIVATE_POLICY"
    - name: Focused network channel, projection, stride and Dense gates
      if: ${{ matrix.gate != 'residual-block-pilot' }}
      working-directory: DominoSearch
      env:
        OPENEYE_RUN_NETWORK_TILE_SMOKE: '1'
        OPENEYE_SIMULATOR: verilator
        OPENEYE_FAIL_ON_STALL: '500000'
        OPENEYE_WRAPPER_TIMEOUT_SECONDS: '1800'
        OPENEYE_MAX_PROCS: '2'
      run: |
        set +e
        (
        OPENEYE_ROOT="$GITHUB_WORKSPACE/OpenEye" ../OpenEye/.venv/bin/python -m pytest -q \
          tests/test_packed_layer_fixture.py -k network_channel_tiles_smoke \
          --basetemp "$RUNNER_TEMP/network-smoke"
        ) > "$RUNNER_TEMP/private-focused.log" 2>&1
        status=$?
        set -e
        printf 'Private simulator execution exit status: %s\n' "$status"
        exit "$status"
    - name: Retrieve immutable bundle
      run: |
        rclone copy --immutable --config "$RUNNER_TEMP/rclone.conf" "$BUNDLE_REMOTE" "$RUNNER_TEMP/packed-bundle"
        printf '%s  %s\n' \
          b41ef3ce1bcf2440f68ae8ce0fdfff372fc1688002aa355992a128c7173d34e1 \
          "$RUNNER_TEMP/packed-bundle/mac20-packed-v1.tar" \
          94bda0012422442ffa95812e07d1d1fc88384ebeaf5ae47381e30ed496cc5edd \
          "$RUNNER_TEMP/packed-bundle/mac23-packed-v1.tar" | sha256sum --check --strict
        tar --extract --file "$RUNNER_TEMP/packed-bundle/mac20-packed-v1.tar" \
          --directory "$RUNNER_TEMP/packed-bundle" --no-same-owner --no-same-permissions
        tar --extract --file "$RUNNER_TEMP/packed-bundle/mac23-packed-v1.tar" \
          --directory "$RUNNER_TEMP/packed-bundle" --no-same-owner --no-same-permissions
    - name: Execute selected hybrid correctness runtime
      working-directory: DominoSearch
      env:
        PILOT_SPATIAL_SIZE: ${{ matrix.gate == 'network-fc-smoke' && '56' || (inputs.scope == 'hybrid-network' || inputs.scope == 'hybrid-network-resumable') && '16'
          || inputs.spatial_size }}
        PILOT_SCOPE: ${{ matrix.gate }}
        OPENEYE_SIMULATOR: verilator
        OPENEYE_FAIL_ON_STALL: '500000'
        OPENEYE_WRAPPER_TIMEOUT_SECONDS: '12000'
        OMP_NUM_THREADS: '2'
        OPENBLAS_NUM_THREADS: '2'
      run: |
        set +e
        (
        case "$PILOT_SCOPE" in
          residual-block-pilot)
            ../OpenEye/.venv/bin/python fpga/openeye/run_residual_block.py \
              --bundle-root "$RUNNER_TEMP/packed-bundle" --openeye-root ../OpenEye \
              --private-root "$RUNNER_TEMP/residual-private" \
              --evidence "$RUNNER_TEMP/residual-evidence" --spatial-size "$PILOT_SPATIAL_SIZE"
            ;;
          downsample-block-pilot|network-fc-smoke)
            case "$PILOT_SCOPE" in
              downsample-block-pilot) runtime_mode=downsample-block ;;
              network-fc-smoke) runtime_mode=fc-smoke ;;
            esac
            ../OpenEye/.venv/bin/python fpga/openeye/run_network_inference.py \
              --bundle-root "$RUNNER_TEMP/packed-bundle" --openeye-root ../OpenEye \
              --private-root "$RUNNER_TEMP/residual-private" \
              --evidence "$RUNNER_TEMP/residual-evidence" --spatial-size "$PILOT_SPATIAL_SIZE" \
              --mode "$runtime_mode"
            ;;
          *) echo "Invalid hybrid runtime scope" >&2; exit 2 ;;
        esac
        ) > "$RUNNER_TEMP/private-runtime.log" 2>&1
        status=$?
        set -e
        printf 'Private simulator execution exit status: %s\n' "$status"
        exit "$status"
    - name: Freeze evidence without weights, activations or coefficients
      if: always()
      run: |
        evidence="$RUNNER_TEMP/residual-public-input"
        mkdir -p "$evidence"
        if test -d "$RUNNER_TEMP/residual-evidence"; then
          cp -a "$RUNNER_TEMP/residual-evidence/." "$evidence/"
        fi
        if test -d "$RUNNER_TEMP/network-smoke"; then
          while IFS= read -r runtime_smoke_path; do
            runtime_smoke_name=$(basename "$(dirname "$runtime_smoke_path")")
            cp -a "$runtime_smoke_path" "$evidence/focused-$runtime_smoke_name"
          done < <(find "$RUNNER_TEMP/network-smoke" -mindepth 2 -maxdepth 2 -type d -name rtl)
        fi
        (
          cd "$evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum
        ) > "$RUNNER_TEMP/residual-SHA256SUMS"
        mv "$RUNNER_TEMP/residual-SHA256SUMS" "$evidence/SHA256SUMS"

        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/publish_public_evidence.py --source "$RUNNER_TEMP/residual-public-input" --output "$RUNNER_TEMP/residual-upload"
    - name: Verify complete gate evidence before enabling network
      if: ${{ success() && matrix.gate != 'residual-block-pilot' }}
      env:
        GATE: ${{ matrix.gate }}
      run: |
        case "$GATE" in
          downsample-block-pilot) runtime_mode=downsample-block ;;
          network-fc-smoke) runtime_mode=fc-smoke ;;
          *) exit 2 ;;
        esac
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/verify_network_evidence.py \
          --evidence "$RUNNER_TEMP/residual-upload" --mode "$runtime_mode" --domino-commit "$GITHUB_SHA"
    - name: Export audited layer counters and report coverage
      if: ${{ always() && matrix.gate != 'residual-block-pilot' }}
      run: |
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/export_network_measurements.py \
          --evidence "$RUNNER_TEMP/residual-upload" --output "$RUNNER_TEMP/runtime-report" --domino-commit "$GITHUB_SHA"
    - name: Upload runtime report tables only
      if: ${{ always() && matrix.gate != 'residual-block-pilot' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: openeye-report-${{ matrix.gate }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/runtime-report
        retention-days: 30
    - name: Upload correctness evidence only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: openeye-runtime-${{ matrix.gate }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/residual-upload
        retention-days: 30
  network_segment_0:
    name: Resumable RTL block layer1.0
    needs: residual
    if: ${{ github.repository == 'baichuu/DominoSearch-OpenEye-Runtime' && (inputs.scope == 'hybrid-network-resumable') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SEGMENT_INDEX: '0'
      CHAIN_ID: ${{ inputs.resume_run_id || github.run_id }}
    steps: &id001
    - name: Check out exact DominoSearch execution commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: DominoSearch
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Check out pinned OpenEye
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Learning-Chips-Lab/OpenEye
        ref: ${{ env.OPENEYE_PIN }}
        path: OpenEye
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: |
          DominoSearch/fpga/openeye/requirements-ci.txt
          DominoSearch/fpga/openeye/requirements-network-resume.txt
    - name: Install simulation and artifact tools
      run: |
        sudo apt-get update
        sudo apt-get install -y iverilog make patch rclone
    - name: Set up pinned Verilator
      uses: veryl-lang/setup-verilator@b155747595eb4b817473a83045ba1da581c4084b
      with:
        version: ${{ env.VERILATOR_VERSION }}
    - name: Create network resume environment and verify clean pin
      run: |
        python -m venv OpenEye/.venv
        OpenEye/.venv/bin/python -m pip install -r DominoSearch/fpga/openeye/requirements-ci.txt -r DominoSearch/fpga/openeye/requirements-network-resume.txt
        OpenEye/.venv/bin/python -m pip install -e OpenEye
        test "$(git -C OpenEye rev-parse HEAD)" = "$OPENEYE_PIN"
        test -z "$(git -C OpenEye status --short)"
        verilator --version | grep -F "Verilator $VERILATOR_VERSION"
    - name: Verify checkpoint negative controls
      working-directory: DominoSearch
      run: ../OpenEye/.venv/bin/python -m pytest -q tests/test_network_checkpoint.py tests/test_network_stage_resume.py tests/test_network_drive_access.py tests/test_public_evidence.py
        tests/test_public_runtime_export.py
    - name: Download downsample gate attempts from this dispatch
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: openeye-runtime-downsample-block-pilot-${{ github.sha }}-*
        path: ${{ runner.temp }}/downsample-gate-attempts
    - name: Download FC gate attempts from this dispatch
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: openeye-runtime-network-fc-smoke-${{ github.sha }}-*
        path: ${{ runner.temp }}/fc-gate-attempts
    - name: Reverify complete same-commit gates before any segment
      run: |
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/select_network_gate.py --container "$RUNNER_TEMP/downsample-gate-attempts" --output "$RUNNER_TEMP/downsample-gate" --mode downsample-block --domino-commit "$GITHUB_SHA"
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/select_network_gate.py --container "$RUNNER_TEMP/fc-gate-attempts" --output "$RUNNER_TEMP/fc-gate" --mode fc-smoke --domino-commit "$GITHUB_SHA"
    - name: Configure private artifact access
      env:
        DOMINO_RCLONE_CONFIG_B64: ${{ secrets.DOMINO_RCLONE_CONFIG_B64 }}
        OPENEYE_NETWORK_RESUME_KEY_B64: ${{ secrets.OPENEYE_NETWORK_RESUME_KEY_B64 }}
      run: |
        python DominoSearch/fpga/openeye/prepare_ci_rclone_config.py --output "$RUNNER_TEMP/rclone.conf"
        # Check key/config now. run_network_segment.sh performs the current
        # owner-only ACL audit before any checkpoint list/read/write; avoid
        # two back-to-back permissions.list calls per segment.
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/network_checkpoint.py preflight --config "$RUNNER_TEMP/rclone.conf"
    - name: Retrieve and verify immutable source archives
      run: |
        rclone copy --immutable --config "$RUNNER_TEMP/rclone.conf" "$BUNDLE_REMOTE" "$RUNNER_TEMP/packed-bundle"
        printf '%s  %s\n' \
          b41ef3ce1bcf2440f68ae8ce0fdfff372fc1688002aa355992a128c7173d34e1 "$RUNNER_TEMP/packed-bundle/mac20-packed-v1.tar" \
          94bda0012422442ffa95812e07d1d1fc88384ebeaf5ae47381e30ed496cc5edd "$RUNNER_TEMP/packed-bundle/mac23-packed-v1.tar" | sha256sum --check --strict
        tar --extract --file "$RUNNER_TEMP/packed-bundle/mac20-packed-v1.tar" --directory "$RUNNER_TEMP/packed-bundle" --no-same-owner --no-same-permissions
        tar --extract --file "$RUNNER_TEMP/packed-bundle/mac23-packed-v1.tar" --directory "$RUNNER_TEMP/packed-bundle" --no-same-owner --no-same-permissions
    - name: Execute or resume checked actual DUT block boundary
      env:
        OPENEYE_NETWORK_RESUME_KEY_B64: ${{ secrets.OPENEYE_NETWORK_RESUME_KEY_B64 }}
        OPENEYE_SIMULATOR: verilator
        OPENEYE_FAIL_ON_STALL: '500000'
        OPENEYE_WRAPPER_TIMEOUT_SECONDS: '12000'
        OPENEYE_MAX_PROCS: '2'
        OMP_NUM_THREADS: '2'
        OPENBLAS_NUM_THREADS: '2'
      run: |
        set +e
        (
        bash DominoSearch/fpga/openeye/run_network_segment.sh OpenEye "$RUNNER_TEMP/packed-bundle" \
          "$RUNNER_TEMP/network-segment" "$SEGMENT_INDEX" "$CHAIN_ID" \
          "$RUNNER_TEMP/rclone.conf" "$RUNNER_TEMP/downsample-gate"
        ) > "$RUNNER_TEMP/private-runtime.log" 2>&1
        status=$?
        set -e
        printf 'Private simulator execution exit status: %s\n' "$status"
        exit "$status"
    - name: Export audited prefix measurements (count each stage once)
      if: always()
      run: |
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/publish_public_evidence.py --source "$RUNNER_TEMP/network-segment/evidence" --output "$RUNNER_TEMP/network-public-evidence"
        OpenEye/.venv/bin/python DominoSearch/fpga/openeye/export_network_measurements.py \
          --evidence "$RUNNER_TEMP/network-public-evidence" --output "$RUNNER_TEMP/network-report" --domino-commit "$GITHUB_SHA"
    - name: Upload prefix report tables only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: openeye-report-segment-${{ env.SEGMENT_INDEX }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/network-report
        retention-days: 30
    - name: Upload only public correctness evidence (never checkpoint or private state)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: openeye-network-segment-${{ env.SEGMENT_INDEX }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/network-public-evidence
        retention-days: 30
  network_segment_1:
    name: Resumable RTL block layer1.1
    needs: network_segment_0
    if: ${{ github.repository == 'baichuu/DominoSearch-OpenEye-Runtime' && (inputs.scope == 'hybrid-network-resumable') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SEGMENT_INDEX: '1'
      CHAIN_ID: ${{ inputs.resume_run_id || github.run_id }}
    steps: *id001
  network_segment_2:
    name: Resumable RTL block layer2.0
    needs: network_segment_1
    if: ${{ github.repository == 'baichuu/DominoSearch-OpenEye-Runtime' && (inputs.scope == 'hybrid-network-resumable') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
